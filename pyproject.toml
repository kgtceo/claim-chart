[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claim-chart"
version = "1.0.0"
description = "An AI patent claim-chart / prior-art anticipation tool — splits an independent claim into its limitations and maps each to a prior-art reference with a verbatim quote (or marks it not disclosed), grounded so it can't invent a disclosure, with a planted-case eval harness. Educational, not legal advice."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kareem Ghazal" }]
dependencies = [
    "anthropic>=0.39",
    "pydantic>=2.5",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
claim-chart = "claim_chart.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/claim_chart"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests", "evals"]
testpaths = ["tests"]
addopts = "-q"
